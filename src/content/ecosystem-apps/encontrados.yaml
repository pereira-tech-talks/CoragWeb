tagline:
  es: Reencuentros con foto
  en: Reunions with a photo
what:
  es: >-
    Para rescatistas y equipos de respuesta: subes una foto de alguien que
    tienes contigo; se compara con reportes de búsqueda y la foto se borra.
    Las familias también pueden reportar a una persona desaparecida.
  en: >-
    For rescuers and response teams: upload a photo of someone with you; it is
    matched against missing-person reports and then deleted. Families can also
    report a missing person.
how:
  es: Usas «La tengo conmigo» o «Reporta desaparecido» según tu rol en campo.
  en: Use “I have them with me” or “Report missing” depending on your field role.
