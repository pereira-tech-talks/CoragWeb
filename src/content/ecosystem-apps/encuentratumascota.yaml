name: Encuentra tu mascota
url: https://encuentratumascota.co/anuncios/se-busca
aliases: []
category: pets
featured: false
order: 10
logo: /images/ecosystem/encuentratumascota/logo.webp
logoAuthorization: pending_contact
monogram: EM
tagline:
  es: Clasificados de mascotas
  en: Pet classifieds
what:
  es: Clasificados para reunir mascotas perdidas con su familia.
  en: Classifieds to reunite lost pets with their families.
how:
  es: Publicas o buscas anuncios «se busca» con fotos y datos de la mascota.
  en: Post or browse “missing” listings with photos and pet details.
active: true
overview:
  es: Clasificados para reunir mascotas perdidas con su familia, con anuncios «se busca» y fotos.
  en: Classifieds to reunite lost pets with their families, with “missing” listings and photos.
features:
  - es: Anuncios «se busca»
    en: “Missing” listings
  - es: Fotos y datos de la mascota
    en: Photos and pet details
  - es: Publicación y búsqueda de anuncios
    en: Post and browse listings
  - es: API pública documentada (JSON:API) con clave de acceso, filtros por tipo, ciudad y estado
    en: Documented public API (JSON:API) with an access key and filters by type, city, and status
tools:
  - es: Clasificados de mascotas perdidas
    en: Lost-pet classifieds
  - es: GET /api/v1/pet-ads — listar anuncios activos con filtros y paginación
    en: GET /api/v1/pet-ads — list active listings with filters and pagination
  - es: GET /api/v1/pet-ads/{uuid} — consultar un anuncio
    en: GET /api/v1/pet-ads/{uuid} — fetch one listing
  - es: POST /api/v1/pet-ads/{uuid}/reports — dejar una pista con teléfono de contacto
    en: POST /api/v1/pet-ads/{uuid}/reports — leave a tip with a contact phone
audience:
  es: Familias que buscan o reportan mascotas perdidas.
  en: Families searching for or reporting lost pets.
coverage:
  es: Según los anuncios publicados en el sitio.
  en: Per listings published on the site.
limits:
  es: No es un servicio veterinario ni de rescate oficial.
  en: Not a veterinary service or official rescue agency.
integrations:
  publicApi: yes
  publicMcp: no
  apiDocsUrl: https://encuentratumascota.co/references
  notes:
    es: "API JSON:API documentada en /references. Requiere clave (Authorization Bearer o X-Api-Key) que entrega el servicio; escribe a info@encuentratumascota.co. Límites: 120 lecturas/min y 2 reportes/min por clave. Sin OpenAPI ni MCP anunciados."
    en: "JSON:API documented at /references. Requires a key (Authorization Bearer or X-Api-Key) issued by the service; write to info@encuentratumascota.co. Limits: 120 reads/min and 2 reports/min per key. No OpenAPI spec or MCP announced."
